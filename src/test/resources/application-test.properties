# Base de datos temporal H2 para pruebas.
spring.datasource.url=jdbc:h2:mem:reservas_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Las tablas nacen al iniciar la prueba y desaparecen al terminar.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Evita leer tu .env de desarrollo.
spring.config.import=

# JWT exclusivo de pruebas: nunca usar en producción.
app.jwt.secret=clave_de_prueba_jwt_muy_larga_de_mas_de_64_caracteres_para_tests_2026
app.jwt.access-expiration-minutes=15
app.jwt.refresh-expiration-days=7

# Fecha/hora de negocio.
spring.jackson.time-zone=America/Lima
app.time-zone=America/Lima

# CORS de test.
app.cors.allowed-origins=http://localhost:5173